name: Publish to PyPI

on:
  push:
    tags: ["v*"]  # e.g. v1.0.2 -> publishes version 1.0.2
  workflow_dispatch:  # manual fallback
    inputs:
      confirm:
        description: "Type 'publish' to confirm release to PyPI"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'publish' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --extras all --with test

      - name: Run tests
        run: poetry run pytest

  publish-pypi:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: pypi
      url: https://pypi.org/p/countryinfo

    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publisher

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history needed for dynamic versioning

      - name: Check tag is on main
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install poetry-dynamic-versioning plugin
        run: poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: poetry install --only main

      - name: Build package
        run: poetry build

      - name: Check built version matches tag
        if: ${{ github.event_name == 'push' }}
        run: |
          expected="countryinfo-${GITHUB_REF_NAME#v}.tar.gz"
          if [ ! -f "dist/${expected}" ]; then
            echo "::error::Expected dist/${expected} for tag ${GITHUB_REF_NAME}, got:"
            ls dist/
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
